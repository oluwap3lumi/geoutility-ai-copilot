[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "T20"]
ignore = ["E501", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-runtime -o cache_dir=.pytest-runtime-cache"
markers = [
  "qgis: requires the QGIS runtime",
  "integration: opt-in external-service integration test",
]
